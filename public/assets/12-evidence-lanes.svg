<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Five kinds of word knowledge</title><desc id="desc">Separate evidence dimensions; these are examples, not a learner scorecard.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="710" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">Five kinds of word knowledge</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">Separate evidence dimensions; these are examples, not a learner scorecard.</text><rect x="36" y="143" width="1128" height="76" rx="12" fill="white" stroke="#087f82" stroke-width="2"/><text x="58" y="190" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#087f82">Recognition</text><text x="330" y="190" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#142c3c">Choose the matching meaning.</text><rect x="36" y="234" width="1128" height="76" rx="12" fill="white" stroke="#ae472b" stroke-width="2"/><text x="58" y="281" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ae472b">Listening</text><text x="330" y="281" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#142c3c">Understand heard language, text hidden.</text><rect x="36" y="325" width="1128" height="76" rx="12" fill="white" stroke="#087f82" stroke-width="2"/><text x="58" y="372" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#087f82">Recall</text><text x="330" y="372" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#142c3c">Retrieve the word without choices.</text><rect x="36" y="416" width="1128" height="76" rx="12" fill="white" stroke="#ae472b" stroke-width="2"/><text x="58" y="463" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ae472b">Spelling</text><text x="330" y="463" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#142c3c">Produce its written form accurately.</text><rect x="36" y="507" width="1128" height="76" rx="12" fill="white" stroke="#087f82" stroke-width="2"/><text x="58" y="554" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#087f82">Independent use</text><text x="330" y="554" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#142c3c">Use it appropriately in a new context.</text><text x="36" y="688" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>