<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">One fact set, three registers</title><desc id="desc">Keep postponement, incomplete staffing and no confirmed date invariant.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="760" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">One fact set, three registers</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">Keep postponement, incomplete staffing and no confirmed date invariant.</text><rect x="36" y="140" width="1128" height="156" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="178" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">Formal note</text><text x="58" y="217" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">L’avvio è rinviato: il piano dei turni è incompleto.</text><text x="58" y="251" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">La nuova data sarà comunicata dopo la verifica.</text><rect x="36" y="328" width="1128" height="146" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="58" y="366" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">Team message</text><text x="58" y="405" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Dobbiamo rimandare la prova: mancano alcuni turni.</text><text x="58" y="439" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Per ora non abbiamo una nuova data.</text><rect x="36" y="506" width="1128" height="146" rx="18" fill="white" stroke="#142c3c" stroke-width="3"/><text x="58" y="544" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#142c3c">Public explanation</text><text x="58" y="583" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">La prova partirà più tardi del previsto.</text><text x="58" y="617" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Comunicheremo la data quando sarà confermata.</text><text x="36" y="738" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>