<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">A1 → C2: the communication pathway</title><desc id="desc">A conceptual course map, not a time scale or measured progress graph.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="660" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">A1 → C2: the communication pathway</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">A conceptual course map, not a time scale or measured progress graph.</text><rect x="36" y="140" width="368" height="208" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="178" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">A1 · First contact</text><text x="58" y="217" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Introduce yourself</text><text x="58" y="251" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Use familiar phrases</text><text x="58" y="285" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Communicate with support</text><rect x="426" y="140" width="368" height="208" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="448" y="178" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">A2 · Routine independence</text><text x="448" y="217" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Handle everyday tasks</text><text x="448" y="251" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Describe simple past events</text><text x="448" y="285" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Clarify practical information</text><rect x="816" y="140" width="368" height="208" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="838" y="178" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">B1 · Connected expression</text><text x="838" y="217" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Tell a coherent story</text><text x="838" y="251" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Explain a choice</text><text x="838" y="285" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Handle familiar problems</text><rect x="36" y="378" width="368" height="208" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="58" y="416" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">B2 · Developed argument</text><text x="58" y="455" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Support and qualify claims</text><text x="58" y="489" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Negotiate practical outcomes</text><text x="58" y="523" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Compare sources</text><rect x="426" y="378" width="368" height="208" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="448" y="416" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">C1 · Flexible nuance</text><text x="448" y="455" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Synthesize complex material</text><text x="448" y="489" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Adapt voice and register</text><text x="448" y="523" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Mediate disagreement</text><rect x="816" y="378" width="368" height="208" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="838" y="416" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">C2 · Precise synthesis</text><text x="838" y="455" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Preserve subtle distinctions</text><text x="838" y="489" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Interpret alternative readings</text><text x="838" y="523" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Revise under challenge</text><text x="36" y="638" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>