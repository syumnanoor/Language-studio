<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Assess → learn → use → repair → check again</title><desc id="desc">Review appears only when the learner opens the course; no notifications.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="700" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">Assess → learn → use → repair → check again</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">Review appears only when the learner opens the course; no notifications.</text><rect x="36" y="146" width="368" height="166" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="184" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">1 · Recall</text><text x="58" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Retrieve, don’t just view.</text><rect x="426" y="146" width="368" height="166" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="448" y="184" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">2 · Explain + model</text><text x="448" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">One concept; solved example.</text><rect x="816" y="146" width="368" height="166" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="838" y="184" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">3 · Guided practice</text><text x="838" y="223" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Use support, then fade it.</text><rect x="36" y="368" width="368" height="166" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="58" y="406" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">4 · Independent use</text><text x="58" y="445" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">New prompt, model hidden.</text><rect x="426" y="368" width="368" height="166" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="448" y="406" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">5 · Feedback + repair</text><text x="448" y="445" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Preserve meaning; fix a gap.</text><rect x="816" y="368" width="368" height="166" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="838" y="406" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">6 · Delayed fresh check</text><text x="838" y="445" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Different example after a delay.</text><text x="44" y="617" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#142c3c">Viewing a card ≠ mastery. Transcript success ≠ correct pronunciation.</text><text x="36" y="678" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>