<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Word detective: useful clues, checked forms</title><desc id="desc">Patterns suggest candidates. A dictionary and context confirm the word.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="780" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">Word detective: useful clues, checked forms</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">Patterns suggest candidates. A dictionary and context confirm the word.</text><rect x="36" y="140" width="548" height="176" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="178" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">English adverb -ly → often -mente</text><text x="58" y="217" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">slowly → lentamente</text><text x="58" y="251" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">easily → facilmente</text><text x="58" y="285" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">But well → bene.</text><rect x="616" y="140" width="548" height="176" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="638" y="178" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">English -ty / -ity → often -tà / -ità</text><text x="638" y="217" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">quality → la qualità</text><text x="638" y="251" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">possibility → la possibilità</text><text x="638" y="285" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">But celebration party → la festa.</text><rect x="36" y="356" width="548" height="176" rx="18" fill="white" stroke="#142c3c" stroke-width="3"/><text x="58" y="394" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#142c3c">A word family, not a suffix trick</text><text x="58" y="433" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">family → la famiglia</text><text x="58" y="467" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">family-related → familiare</text><text x="58" y="501" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">familiarity → la familiarità</text><rect x="616" y="356" width="548" height="176" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="638" y="394" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">Resemblance can mislead</text><text x="638" y="433" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">attuale → current</text><text x="638" y="467" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">actual → often reale / effettivo</text><text x="638" y="501" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Learn meaning + article + context.</text><text x="44" y="624" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#142c3c">Try: notice a clue → check the form → learn a phrase → use a new context.</text><text x="36" y="758" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>