<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">Common sound–spelling connections</title><desc id="desc">Hear reviewed Italian models. A correct written sort is not pronunciation evidence.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="830" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">Common sound–spelling connections</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">Hear reviewed Italian models. A correct written sort is not pronunciation evidence.</text><rect x="36" y="136" width="550" height="130" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="174" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">c + a / o / u</text><text x="58" y="213" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">casa → /k/</text><text x="58" y="247" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Not the English letter name</text><rect x="618" y="136" width="550" height="130" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="640" y="174" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">c + e / i</text><text x="640" y="213" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">cena → /tʃ/</text><text x="640" y="247" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Listen to the whole word</text><rect x="36" y="290" width="550" height="130" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="328" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">ch + e / i</text><text x="58" y="367" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">chiave → /k/</text><text x="58" y="401" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">h has a spelling role</text><rect x="618" y="290" width="550" height="130" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="640" y="328" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">g + e / i</text><text x="640" y="367" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">gelato → /dʒ/</text><text x="640" y="401" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Compare g in gatto: /g/</text><rect x="36" y="444" width="550" height="130" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="482" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">gh + e / i</text><text x="58" y="521" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">spaghetti → /g/</text><text x="58" y="555" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">No separate /h/ here</text><rect x="618" y="444" width="550" height="130" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="640" y="482" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">sc + e / i</text><text x="640" y="521" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">scena → /ʃ/</text><text x="640" y="555" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Compare sch: schema /sk/</text><rect x="36" y="598" width="550" height="130" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="636" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">gn / gli in examples</text><text x="58" y="675" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">bagno → /ɲ/</text><text x="58" y="709" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">famiglia → /ʎ/</text><rect x="618" y="598" width="550" height="130" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="640" y="636" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">Single / double</text><text x="640" y="675" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">pala / palla</text><text x="640" y="709" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Duration can change meaning</text><text x="36" y="808" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>