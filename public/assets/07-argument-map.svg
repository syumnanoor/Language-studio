<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Build a claim that the evidence can support</title><desc id="desc">Original conceptual diagram. No numbers here represent learner performance.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="760" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">Build a claim that the evidence can support</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">Original conceptual diagram. No numbers here represent learner performance.</text><rect x="36" y="144" width="520" height="154" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="182" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">EVIDENCE</text><text x="58" y="221" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">What was actually observed?</text><text x="58" y="255" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Whose source, sample and context?</text><rect x="644" y="144" width="520" height="154" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="666" y="182" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">LIMITATION</text><text x="666" y="221" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">What was not measured?</text><text x="666" y="255" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">What else could explain the result?</text><path d="M296 298 L440 362" stroke="#4b626c" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M904 298 L760 362" stroke="#4b626c" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="280" y="370" width="640" height="146" rx="18" fill="white" stroke="#142c3c" stroke-width="3"/><text x="302" y="408" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#142c3c">QUALIFIED CLAIM</text><text x="302" y="447" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Say exactly what follows.</text><text x="302" y="481" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Avoid broader causal / universal claims.</text><path d="M600 516 L600 564" stroke="#4b626c" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="190" y="574" width="820" height="112" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="212" y="612" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">NEXT DECISION / CHECK</text><text x="212" y="651" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">State a reversible action and evidence that could change it.</text><text x="36" y="738" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>