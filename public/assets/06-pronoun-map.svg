<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">What does the pronoun refer to?</title><desc id="desc">Identify the referent before changing the wording.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="630" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">What does the pronoun refer to?</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">Identify the referent before changing the wording.</text><rect x="36" y="142" width="548" height="178" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="180" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">Direct object · thing read / bought</text><text x="58" y="219" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">il libro → lo leggo</text><text x="58" y="253" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">la giacca → la compro</text><text x="58" y="287" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">i libri → li leggo</text><rect x="616" y="142" width="548" height="178" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="638" y="180" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">Indirect recipient · person written to</text><text x="638" y="219" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">a Sara → le scrivo</text><text x="638" y="253" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">a Marco → gli scrivo</text><text x="638" y="287" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Context keeps the referent clear.</text><rect x="36" y="360" width="1128" height="174" rx="18" fill="white" stroke="#142c3c" stroke-width="3"/><text x="58" y="398" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#142c3c">Placement in a familiar modal pattern</text><text x="58" y="437" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Posso comprare la giacca. → Posso comprarla.</text><text x="58" y="471" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">La posso comprare. is also possible.</text><text x="58" y="505" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">This is not a complete reference for every pronoun combination.</text><text x="36" y="608" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>