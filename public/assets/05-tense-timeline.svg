<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">Time, viewpoint and possibility</title><desc id="desc">A symbolic map: tense/aspect and mood are not determined by duration alone.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="830" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">Time, viewpoint and possibility</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">A symbolic map: tense/aspect and mood are not determined by duration alone.</text><path d="M85 225 L1110 225" stroke="#4b626c" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="70" y="195" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ae472b">PAST</text><text x="560" y="195" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#087f82">NOW</text><text x="990" y="195" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ae472b">FUTURE</text><rect x="36" y="270" width="548" height="164" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="308" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">Past viewpoint</text><text x="58" y="347" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Background: Studiavo.</text><text x="58" y="381" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Bounded event: Sara è arrivata.</text><rect x="616" y="270" width="548" height="164" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="638" y="308" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">Present / planned future</text><text x="638" y="347" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Now: Studio italiano.</text><text x="638" y="381" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Plan: Domani lavorerò / lavoro.</text><rect x="36" y="474" width="1128" height="118" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="512" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">Hypothetical now</text><text x="58" y="551" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Se avessi tempo, studierei.  → Imagined condition and consequence.</text><rect x="36" y="626" width="1128" height="118" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="58" y="664" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">Unreal past</text><text x="58" y="703" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Se avessi avuto tempo, avrei studiato.  → Counterfactual past.</text><text x="36" y="808" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>