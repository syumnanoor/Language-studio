<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">One number system, several reading jobs</title><desc id="desc">Always identify the context before choosing a reading.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="810" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">One number system, several reading jobs</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">Always identify the context before choosing a reading.</text><rect x="36" y="138" width="550" height="176" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="176" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">Quantity · 23 libri</text><text x="58" y="215" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">ventitré libri</text><text x="58" y="249" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Twenty-three books</text><rect x="618" y="138" width="550" height="176" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="640" y="176" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">Price · €2,50</text><text x="640" y="215" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">due euro e cinquanta centesimi</text><text x="640" y="249" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Invented teaching price</text><rect x="36" y="342" width="550" height="176" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="380" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">Code fragment · 004</text><text x="58" y="419" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">zero zero quattro</text><text x="58" y="453" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Keep every digit; never call it</text><rect x="618" y="342" width="550" height="176" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="640" y="380" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">Clock · 14:30</text><text x="640" y="419" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">le quattordici e trenta</text><text x="640" y="453" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">A time, not a quantity</text><rect x="36" y="546" width="550" height="176" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="58" y="584" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">Date · 03/04/2026</text><text x="58" y="623" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">3 April 2026</text><text x="58" y="657" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Italian day / month / year</text><rect x="618" y="546" width="550" height="176" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="640" y="584" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">Decimal · 1,5</text><text x="640" y="623" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">uno virgola cinque</text><text x="640" y="657" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Say the decimal comma</text><text x="36" y="788" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>