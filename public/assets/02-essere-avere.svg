<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Essere or avere? Meaning first, person second</title><desc id="desc">These are beginner meaning patterns; auxiliary choice in past tenses is a separate lesson.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b626c"/></marker></defs><rect width="1200" height="780" fill="#fbf7ef"/><text x="36" y="57" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#142c3c">Essere or avere? Meaning first, person second</text><text x="36" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#4b626c">These are beginner meaning patterns; auxiliary choice in past tenses is a separate lesson.</text><rect x="365" y="126" width="470" height="96" rx="18" fill="white" stroke="#142c3c" stroke-width="3"/><text x="387" y="164" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#142c3c">1 · What do you mean?</text><path d="M500 222 L300 282" stroke="#4b626c" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M700 222 L900 282" stroke="#4b626c" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="38" y="286" width="546" height="226" rx="18" fill="white" stroke="#087f82" stroke-width="3"/><text x="60" y="324" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f82">ESSERE · be</text><text x="60" y="363" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Identity: Sono Amal.</text><text x="60" y="397" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Location: Sono qui.</text><text x="60" y="431" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Description: Sono stanca.</text><text x="60" y="465" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">She / polite you: è</text><rect x="616" y="286" width="546" height="226" rx="18" fill="white" stroke="#ae472b" stroke-width="3"/><text x="638" y="324" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ae472b">AVERE · have</text><text x="638" y="363" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Possession: Ho un libro.</text><text x="638" y="397" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Fixed expression: Ho fame.</text><text x="638" y="431" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">Age: Ho vent’anni.</text><text x="638" y="465" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">She / polite you: ha</text><rect x="38" y="548" width="1124" height="150" rx="18" fill="white" stroke="#142c3c" stroke-width="3"/><text x="60" y="586" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#142c3c">2 · Choose the subject → choose the form</text><text x="60" y="625" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">io: sono / ho · tu: sei / hai · lei or polite Lei: è / ha</text><text x="60" y="659" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#142c3c">noi: siamo / abbiamo · voi: siete / avete · loro: sono / hanno</text><text x="36" y="758" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#4b626c">Italian for life | Draft teaching visual | Labels carry meaning as well as colour</text></svg>